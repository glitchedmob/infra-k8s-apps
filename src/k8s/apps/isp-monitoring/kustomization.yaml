apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: isp-monitoring
resources:
  - ../../platform/services/backup-base
  - namespace.yaml
  - secretstore.yaml
  - externalsecret.yaml
  - storage.yaml
  - speedtest.yaml
  - smokeping.yaml
  - oauth2-proxy.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - backup.yaml
patches:
  - path: backup-patch.yaml
    target:
      group: k8up.io
      kind: PreBackupPod
      name: app-backup
      version: v1
  - path: schedule-patch.yaml
    target:
      group: k8up.io
      kind: Schedule
      name: app-backup
      version: v1
configMapGenerator:
  - name: speedtest-init
    files:
      - init-scheduler.sh=config/init-scheduler.sh
  - name: speedtest-scripts
    files:
      - scheduler.php=config/scheduler.php
  - name: smokeping-config
    files:
      - Database=config/Database
      - General=config/General
      - Probes=config/Probes
      - Targets=config/Targets
  - name: isp-allowed-emails
    literals:
      - allowed-emails=me@levizitting.com
