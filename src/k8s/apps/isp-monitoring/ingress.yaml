apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: isp-monitoring-tls
spec:
  secretName: isp-monitoring-tls
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    name: levizitting-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - speedtest.levizitting.com
    - smokeping.levizitting.com
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: isp-sso
spec:
  forwardAuth:
    address: http://isp-oauth2-proxy.isp-monitoring.svc.cluster.local/
    maxResponseBodySize: 1048576
    addAuthCookiesToResponse:
      - _isp_oauth2_proxy
      - _isp_oauth2_proxy_csrf
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: isp-monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`speedtest.levizitting.com`) && PathPrefix(`/oauth2/`)
      priority: 100
      services:
        - name: isp-oauth2-proxy
          port: 80
    - kind: Rule
      match: Host(`speedtest.levizitting.com`)
      middlewares:
        - name: isp-sso
      services:
        - name: speedtest
          port: 80
    - kind: Rule
      match: Host(`smokeping.levizitting.com`)
      middlewares:
        - name: isp-sso
      services:
        - name: smokeping
          port: 80
  tls:
    secretName: isp-monitoring-tls
