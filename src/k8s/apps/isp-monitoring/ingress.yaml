apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: isp-monitoring-tls
spec:
  secretName: isp-monitoring-tls
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    name: levizitting-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - speedtest.levizitting.com
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: isp-monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`speedtest.levizitting.com`)
      services:
        - name: speedtest
          port: 80
  tls:
    secretName: isp-monitoring-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: isp-monitoring-redirect
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`speedtest.levizitting.com`)
      middlewares:
        - name: isp-https-redirect
      services:
        - name: noop@internal
          kind: TraefikService
