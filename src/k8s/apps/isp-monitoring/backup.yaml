apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: isp-backup-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: k8up-b2-credentials
    creationPolicy: Owner
  data:
    - secretKey: account-id
      remoteRef:
        key: /vm-workloads/lz/infra-vm-workloads/backups/b2-account-id
    - secretKey: account-key
      remoteRef:
        key: /vm-workloads/lz/infra-vm-workloads/backups/b2-account-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: isp-backup-password
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: isp-monitoring-openbao
    kind: SecretStore
  target:
    name: isp-backup-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: isp-monitoring/backup
        property: resticPassword
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: isp-monitoring-backup
automountServiceAccountToken: false
