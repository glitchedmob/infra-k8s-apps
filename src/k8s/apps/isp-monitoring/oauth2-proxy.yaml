apiVersion: apps/v1
kind: Deployment
metadata:
  name: isp-oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: isp-oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: isp-oauth2-proxy
      annotations:
        secret.reloader.stakater.com/reload: isp-oauth2-proxy
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
          args:
            - --provider=oidc
            - --provider-display-name=ZITADEL
            - --http-address=0.0.0.0:4180
            - --redirect-url=https://smokeping.levizitting.com/oauth2/callback
            - --upstream=static://200
            - --reverse-proxy=true
            - --skip-provider-button=true
            - --code-challenge-method=S256
            - --scope=openid email profile
            - --authenticated-emails-file=/etc/isp/allowed-emails
            - --cookie-name=_smokeping_oauth2_proxy
            - --cookie-domain=smokeping.levizitting.com
            - --cookie-secure=true
            - --cookie-expire=8h
            - --whitelist-domain=smokeping.levizitting.com
          envFrom:
            - secretRef:
                name: isp-oauth2-proxy
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 4180
          volumeMounts:
            - name: allowed-emails
              mountPath: /etc/isp
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: allowed-emails
          configMap:
            name: isp-allowed-emails
---
apiVersion: v1
kind: Service
metadata:
  name: isp-oauth2-proxy
spec:
  selector:
    app.kubernetes.io/name: isp-oauth2-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
