apiVersion: apps/v1
kind: Deployment
metadata:
  name: smokeping
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: smokeping
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smokeping
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smokeping-prober
          image: quay.io/superq/smokeping-prober:v0.12.0
          args:
            - --config.file=/etc/smokeping-prober/config.yaml
          env:
            - name: GOMAXPROCS
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_RAW
          ports:
            - name: metrics
              containerPort: 9374
          volumeMounts:
            - name: config
              mountPath: /etc/smokeping-prober
              readOnly: true
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
          livenessProbe:
            tcpSocket:
              port: metrics
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: smokeping-prober-config
---
apiVersion: v1
kind: Service
metadata:
  name: smokeping
  labels:
    app.kubernetes.io/name: smokeping
spec:
  selector:
    app.kubernetes.io/name: smokeping
  ports:
    - name: metrics
      port: 9374
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: smokeping
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: smokeping
  # Dashboard 18004 queries classic histogram buckets, counts, and sums.
  scrapeClassicHistograms: true
  endpoints:
    - port: metrics
      interval: 15s
