apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: private-dashboards
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 4180
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: speedtest-scheduler
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: speedtest
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: speedtest-scheduler
      ports:
        - protocol: TCP
          port: 80
