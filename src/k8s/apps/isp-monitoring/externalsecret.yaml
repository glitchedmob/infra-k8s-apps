apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: speedtest-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: isp-monitoring-openbao
    kind: SecretStore
  target:
    name: speedtest-runtime
    creationPolicy: Owner
  data:
    - secretKey: APP_KEY
      remoteRef:
        key: isp-monitoring/app-key
        property: appKey
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: isp-monitoring/admin-password
        property: adminPassword
