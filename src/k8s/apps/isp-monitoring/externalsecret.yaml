apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: speedtest-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: isp-monitoring-openbao
    kind: SecretStore
  target:
    name: speedtest-runtime
    creationPolicy: Owner
  data:
    - secretKey: APP_KEY
      remoteRef:
        key: isp-monitoring/runtime
        property: appKey
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: isp-monitoring/runtime
        property: adminPassword
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: isp-oauth2-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: isp-monitoring-openbao
    kind: SecretStore
  target:
    name: isp-oauth2-proxy
    creationPolicy: Owner
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: isp-monitoring/oidc
        property: clientId
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: isp-monitoring/oidc
        property: clientSecret
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: isp-monitoring/oidc
        property: cookieSecret
    - secretKey: OAUTH2_PROXY_OIDC_ISSUER_URL
      remoteRef:
        key: isp-monitoring/oidc
        property: issuerUrl
