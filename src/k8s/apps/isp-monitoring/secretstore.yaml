apiVersion: v1
kind: ServiceAccount
metadata:
  name: isp-monitoring-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: isp-monitoring-openbao
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc.cluster.local:8200
      path: applications
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: isp-monitoring-secrets
          serviceAccountRef:
            name: isp-monitoring-secrets
