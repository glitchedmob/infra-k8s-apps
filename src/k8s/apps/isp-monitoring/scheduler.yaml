apiVersion: batch/v1
kind: CronJob
metadata:
  name: speedtest
spec:
  schedule: "0 0,12 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 36300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: speedtest-scheduler
        spec:
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: schedule
              image: curlimages/curl:8.19.0
              command: [sh, /schedule/run.sh]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              env:
                - name: SCHEDULER_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: speedtest-runtime
                      key: SCHEDULER_API_TOKEN
              volumeMounts:
                - name: schedule
                  mountPath: /schedule
                  readOnly: true
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
          volumes:
            - name: schedule
              configMap:
                name: speedtest-schedule
