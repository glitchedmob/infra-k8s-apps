apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: speedtest-config
  annotations:
    # Back up a consistent SQLite snapshot through the pod backup command.
    k8up.io/backup: "false"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smokeping-data
  labels:
    backup.k8up.io/app: isp-monitoring
  annotations:
    k8up.io/backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
