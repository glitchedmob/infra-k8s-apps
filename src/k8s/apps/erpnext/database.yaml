apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: erpnext-db
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=confirm
spec:
  image: mariadb:11.8.6
  replicas: 2
  rootPasswordSecretKeyRef:
    name: erpnext-database
    key: rootPassword
    generate: false
  replication:
    enabled: true
    standaloneProbes: true
    syncBinlog: 1
    semiSyncEnabled: true
    semiSyncWaitPoint: AfterSync
    semiSyncAckTimeout: 10m
    semiSyncWaitNoSlave: true
    semiSyncBootAsReplica: true
    primary:
      autoFailover: true
      autoFailoverDelay: 10m
  startupProbe:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60
  livenessProbe:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12
  storage:
    size: 20Gi
    storageClassName: longhorn
    volumeClaimTemplate:
      metadata:
        annotations:
          k8up.io/backup: "false"
  affinity:
    antiAffinityEnabled: true
  podDisruptionBudget:
    maxUnavailable: 1
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "2"
      memory: 2Gi
  myCnf: |
    [mariadb]
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    skip-character-set-client-handshake
    innodb-buffer-pool-size=512M
    max-connections=100
    log_slave_updates=ON
    sync_relay_log=1
    binlog_expire_logs_seconds=604800
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: erpnext
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  mariaDbRef:
    name: erpnext-db
  characterSet: utf8mb4
  collate: utf8mb4_unicode_ci
  cleanupPolicy: Skip
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: erpnext
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  mariaDbRef:
    name: erpnext-db
  passwordSecretKeyRef:
    name: erpnext-database
    key: password
  host: "%"
  cleanupPolicy: Skip
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: erpnext
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  mariaDbRef:
    name: erpnext-db
  privileges:
    - ALL PRIVILEGES
  database: erpnext
  table: "*"
  username: erpnext
  host: "%"
  cleanupPolicy: Skip
