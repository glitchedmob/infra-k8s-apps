apiVersion: v1
kind: Service
metadata:
  name: erpnext-db
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: erpnext
    app.kubernetes.io/component: database
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: erpnext-db
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    secret.reloader.stakater.com/reload: erpnext-database
spec:
  serviceName: erpnext-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: erpnext
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: erpnext
        app.kubernetes.io/component: database
      annotations:
        k8up.io/backup: "false"
    spec:
      serviceAccountName: erpnext
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: mariadb
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --skip-character-set-client-handshake
            - --skip-name-resolve
            - --innodb-buffer-pool-size=512M
            - --max-connections=100
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: erpnext-database
                  key: rootPassword
            - name: MARIADB_ROOT_HOST
              value: "%"
          ports:
            - name: mysql
              containerPort: 3306
          startupProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: run
              mountPath: /run/mysqld
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          k8up.io/backup: "false"
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 20Gi
