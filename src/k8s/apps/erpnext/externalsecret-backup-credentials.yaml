apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erpnext-backup-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: erpnext-k8s
    kind: ClusterSecretStore
  target:
    name: k8up-b2-credentials
    creationPolicy: Owner
  data:
    - secretKey: account-id
      remoteRef:
        key: erpnext-secrets
        property: b2AccountId
    - secretKey: account-key
      remoteRef:
        key: erpnext-secrets
        property: b2AccountKey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erpnext-k8up-repo-password
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: erpnext-openbao
    kind: SecretStore
  target:
    name: erpnext-k8up-repo-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: erpnext/backup
        property: resticPassword
