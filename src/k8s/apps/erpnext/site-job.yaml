apiVersion: batch/v1
kind: Job
metadata:
  name: erpnext-site
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: erpnext
        app.kubernetes.io/component: install
      annotations:
        k8up.io/backup: "false"
    spec:
      restartPolicy: Never
      serviceAccountName: erpnext
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: install
          image: frappe/erpnext
          args: [bash, -ec, "exec ./env/bin/python /bootstrap/site.py"]
          envFrom:
            - configMapRef:
                name: erpnext-config
          env:
            - name: DB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: erpnext-database
                  key: rootPassword
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: settings
              mountPath: /settings
              readOnly: true
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: erpnext-sites
        - name: logs
          emptyDir: {}
        - name: bootstrap
          configMap:
            name: erpnext-bootstrap
        - name: settings
          secret:
            secretName: erpnext-settings
