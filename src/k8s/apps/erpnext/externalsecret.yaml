apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erpnext-settings
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: erpnext-openbao
  target:
    name: erpnext-settings
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        settings.json: |
          {
            "adminPassword": {{ .adminPassword | toJson }},
            "encryptionKey": {{ .encryptionKey | toJson }},
            "databasePassword": {{ .databasePassword | toJson }}
          }
        social-login.json: |
          {
            "doctype": "Social Login Key",
            "name": "zitadel",
            "social_login_provider": "Custom",
            "provider_name": "Zitadel",
            "enable_social_login": 1,
            "client_id": {{ .clientId | toJson }},
            "client_secret": {{ .clientSecret | toJson }},
            "base_url": {{ .issuerUrl | toJson }},
            "custom_base_url": 1,
            "authorize_url": "/oauth/v2/authorize",
            "access_token_url": "/oauth/v2/token",
            "api_endpoint": "/oidc/v1/userinfo",
            "redirect_url": "/api/method/frappe.integrations.oauth2_logins.custom/zitadel",
            "auth_url_data": "{\"response_type\":\"code\",\"scope\":\"openid profile email\"}",
            "user_id_property": "sub",
            "sign_ups": "Deny"
          }
  data:
    - secretKey: adminPassword
      remoteRef:
        key: erpnext/runtime
        property: adminPassword
    - secretKey: encryptionKey
      remoteRef:
        key: erpnext/runtime
        property: encryptionKey
    - secretKey: databasePassword
      remoteRef:
        key: erpnext/database
        property: password
    - secretKey: clientId
      remoteRef:
        key: erpnext/oidc
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: erpnext/oidc
        property: clientSecret
    - secretKey: issuerUrl
      remoteRef:
        key: erpnext/oidc
        property: issuerUrl
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erpnext-database
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: erpnext-openbao
  target:
    name: erpnext-database
    creationPolicy: Owner
  data:
    - secretKey: rootPassword
      remoteRef:
        key: erpnext/database
        property: rootPassword
