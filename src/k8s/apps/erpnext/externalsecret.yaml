apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erpnext-settings
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: erpnext-openbao
  target:
    name: erpnext-settings
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        settings.json: |
          {
            "adminPassword": {{ .adminPassword | toJson }},
            "encryptionKey": {{ .encryptionKey | toJson }},
            "databasePassword": {{ .databasePassword | toJson }},
            "oidc": {
              "clientId": {{ .clientId | toJson }},
              "clientSecret": {{ .clientSecret | toJson }},
              "issuerUrl": {{ .issuerUrl | toJson }}
            },
            "socialLogin": {
              "providerName": "Zitadel",
              "providerId": "zitadel",
              "authorizeUrl": "/oauth/v2/authorize",
              "tokenUrl": "/oauth/v2/token",
              "userinfoUrl": "/oidc/v1/userinfo",
              "scope": "openid profile email",
              "signUps": "Deny"
            },
            "disableSignup": true
          }
  data:
    - secretKey: adminPassword
      remoteRef:
        key: erpnext/runtime
        property: adminPassword
    - secretKey: encryptionKey
      remoteRef:
        key: erpnext/runtime
        property: encryptionKey
    - secretKey: databasePassword
      remoteRef:
        key: erpnext/database
        property: password
    - secretKey: clientId
      remoteRef:
        key: erpnext/oidc
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: erpnext/oidc
        property: clientSecret
    - secretKey: issuerUrl
      remoteRef:
        key: erpnext/oidc
        property: issuerUrl
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erpnext-database
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: erpnext-openbao
  target:
    name: erpnext-database
    creationPolicy: Owner
  data:
    - secretKey: rootPassword
      remoteRef:
        key: erpnext/database
        property: rootPassword
