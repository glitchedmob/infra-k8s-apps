apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: erpnext
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: erpnext-erpnext-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - finances.levizitting.com
      secretName: finances-levizitting-com-tls
  rules:
    - host: finances.levizitting.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: erpnext
                port:
                  name: http
