apiVersion: v1
kind: ServiceAccount
metadata:
  name: erpnext-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: erpnext
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: erpnext-openbao
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc.cluster.local:8200
      path: applications
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: erpnext-secrets
          serviceAccountRef:
            name: erpnext-secrets
