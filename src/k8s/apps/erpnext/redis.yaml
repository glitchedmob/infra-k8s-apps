apiVersion: parameters.kubeblocks.io/v1alpha1
kind: Parameter
metadata:
  name: erpnext
  labels:
    app.kubernetes.io/instance: erpnext
    config.kubeblocks.io/init-parameters: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  clusterName: erpnext
  componentParameters:
    - componentName: redis
      userConfigTemplates:
        redis-replication-config:
          templateRef: erpnext-redis-overrides
          namespace: erpnext
          policy: patch
---
apiVersion: apps.kubeblocks.io/v1
kind: Cluster
metadata:
  name: erpnext
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  clusterDef: redis
  topology: replication
  terminationPolicy: DoNotTerminate
  services:
    - name: primary
      serviceName: redis
      componentSelector: redis
      roleSelector: primary
      spec:
        type: ClusterIP
        ports:
          - name: redis
            port: 6379
            targetPort: redis
  componentSpecs:
    - name: redis
      componentDef: redis-8-1.0.2
      serviceVersion: 8.4.0
      replicas: 2
      systemAccounts:
        - name: default
          passwordConfig:
            length: 32
            numDigits: 8
            numSymbols: 0
            letterCase: MixedCases
      schedulingPolicy:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: erpnext
                    apps.kubeblocks.io/component-name: redis
                topologyKey: kubernetes.io/hostname
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
      volumeClaimTemplates:
        - name: data
          spec:
            storageClassName: longhorn
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 2Gi
    - name: redis-sentinel
      componentDef: redis-sentinel-8-1.0.2
      serviceVersion: 8.4.0
      replicas: 3
      systemAccounts:
        - name: default
          passwordConfig:
            length: 32
            numDigits: 8
            numSymbols: 0
            letterCase: MixedCases
      schedulingPolicy:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: erpnext
                    apps.kubeblocks.io/component-name: redis-sentinel
                topologyKey: kubernetes.io/hostname
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      volumeClaimTemplates:
        - name: data
          spec:
            storageClassName: longhorn
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
