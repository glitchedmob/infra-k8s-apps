apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcphub-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: mcphub-openbao
  target:
    name: mcphub-runtime
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: mcphub/jwt
        property: jwtSecret
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: mcphub/better-auth
        property: betterAuthSecret
    - secretKey: MCPHUB_CREDENTIAL_ENCRYPTION_KEY
      remoteRef:
        key: mcphub/credential-encryption
        property: credentialEncryptionKey
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: mcphub/admin
        property: adminPassword
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: mcphub/oidc
        property: clientId
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: mcphub/oidc
        property: clientSecret
