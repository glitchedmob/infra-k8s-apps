apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcphub-backup-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: backup-cache-k8s
    kind: ClusterSecretStore
  target:
    name: k8up-b2-credentials
    creationPolicy: Owner
  data:
    - secretKey: account-id
      remoteRef:
        key: backup-ssm-cache
        property: account-id
    - secretKey: account-key
      remoteRef:
        key: backup-ssm-cache
        property: account-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcphub-k8up-repo-password
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: mcphub-openbao
    kind: SecretStore
  target:
    name: mcphub-k8up-repo-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: mcphub/backup
        property: resticPassword
