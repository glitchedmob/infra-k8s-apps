apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: tandoor-media
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  placement:
    replication: "001"
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: tandoor
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  name: apps-tandoor
  reclaimPolicy: Delete
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: tandoor
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  identityRef:
    name: tandoor
  secretRef:
    name: tandoor-s3-credentials
    accessKeyField: S3_ACCESS_KEY
    secretKeyField: S3_SECRET_ACCESS_KEY
  reclaimPolicy: Delete
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Policy
metadata:
  name: tandoor
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  name: apps-tandoor
  statements:
    - effect: Allow
      actions:
        - s3:GetBucketLocation
        - s3:ListBucket
      resources:
        - tandoor-media
    - effect: Allow
      actions:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
      resources:
        - tandoor-media/*
  reclaimPolicy: Delete
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3PolicyBinding
metadata:
  name: tandoor
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  policyRef:
    name: tandoor
  subjects:
    - kind: S3Identity
      name: tandoor
  reclaimPolicy: Delete
