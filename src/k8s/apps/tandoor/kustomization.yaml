apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tandoor
resources:
  - ../../platform/services/backup-base
  - namespace.yaml
  - cluster.yaml
  - secretstore.yaml
  - externalsecret.yaml
  - object-storage.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - backup-serviceaccount.yaml
  - externalsecret-backup-credentials.yaml
patches:
  - path: backup-patch.yaml
    target:
      group: k8up.io
      version: v1
      kind: PreBackupPod
      name: app-backup
  - path: schedule-patch.yaml
    target:
      group: k8up.io
      version: v1
      kind: Schedule
      name: app-backup
