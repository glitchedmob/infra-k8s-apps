apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sparky
resources:
  - ../../platform/services/backup-base
  - namespace.yaml
  - secretstore.yaml
  - password.yaml
  - externalsecret-app-db.yaml
  - cluster.yaml
  - externalsecret.yaml
  - uploads-pvc.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - backend-networkpolicy.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - frontend-pdb.yaml
  - middleware-https-redirect.yaml
  - ingress.yaml
  - backup-serviceaccount.yaml
  - externalsecret-backup-credentials.yaml
patches:
  - path: backup-patch.yaml
    target:
      group: k8up.io
      version: v1
      kind: PreBackupPod
      name: app-backup
  - path: schedule-patch.yaml
    target:
      group: k8up.io
      version: v1
      kind: Schedule
      name: app-backup
