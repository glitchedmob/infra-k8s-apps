apiVersion: apps/v1
kind: Deployment
metadata:
  name: sparky-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sparky
      app.kubernetes.io/component: server
  template:
    metadata:
      annotations:
        secret.reloader.stakater.com/reload: sparky-runtime,sparky-db-app,sparky-app-db
      labels:
        app.kubernetes.io/name: sparky
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: codewithcj/sparkyfitness_server:v1.6.2
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3010
          envFrom:
            - secretRef:
                name: sparky-runtime
          env:
            - name: SPARKY_FITNESS_DB_HOST
              value: sparky-db-rw
            - name: SPARKY_FITNESS_DB_PORT
              value: "5432"
            - name: SPARKY_FITNESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: sparky-db-app
                  key: dbname
            - name: SPARKY_FITNESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: sparky-db-app
                  key: username
            - name: SPARKY_FITNESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sparky-db-app
                  key: password
            - name: SPARKY_FITNESS_APP_DB_USER
              valueFrom:
                secretKeyRef:
                  name: sparky-app-db
                  key: username
            - name: SPARKY_FITNESS_APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sparky-app-db
                  key: password
            - name: SPARKY_FITNESS_FRONTEND_URL
              value: https://sparky.levizitting.com
            - name: SPARKY_FITNESS_SERVER_PORT
              value: "3010"
            - name: SPARKY_FITNESS_LOG_LEVEL
              value: INFO
            - name: SPARKY_FITNESS_CUSTOM_UPLOADS_DIRECTORY
              value: /app/SparkyFitnessServer/uploads
            - name: SPARKY_FITNESS_CUSTOM_BACKUP_DIRECTORY
              value: /app/SparkyFitnessServer/backup
            - name: SPARKY_FITNESS_EMAIL_HOST
              value: email-smtp.us-east-2.amazonaws.com
            - name: SPARKY_FITNESS_EMAIL_PORT
              value: "587"
            - name: SPARKY_FITNESS_EMAIL_SECURE
              value: "false"
            - name: SPARKY_FITNESS_OIDC_AUTH_ENABLED
              value: "true"
            - name: SPARKY_FITNESS_OIDC_PROVIDER_SLUG
              value: zitadel
            - name: SPARKY_FITNESS_OIDC_PROVIDER_NAME
              value: ZITADEL
            - name: SPARKY_FITNESS_OIDC_AUTO_REGISTER
              value: "true"
            - name: SPARKY_FITNESS_OIDC_AUTO_REDIRECT
              value: "true"
            - name: SPARKY_FITNESS_OIDC_SCOPE
              value: openid email profile
            - name: SPARKY_FITNESS_OIDC_TOKEN_AUTH_METHOD
              value: client_secret_basic
            - name: SPARKY_FITNESS_DISABLE_EMAIL_LOGIN
              value: "true"
            - name: SPARKY_FITNESS_FORCE_EMAIL_LOGIN
              value: "false"
            - name: NODE_ENV
              value: production
            - name: TZ
              value: America/Chicago
          volumeMounts:
            - name: uploads
              mountPath: /app/SparkyFitnessServer/uploads
            - name: backup
              mountPath: /app/SparkyFitnessServer/backup
            - name: temp-uploads
              mountPath: /app/SparkyFitnessServer/temp_uploads
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: sparky-uploads
        - name: backup
          emptyDir: {}
        - name: temp-uploads
          emptyDir: {}
        - name: tmp
          emptyDir: {}
