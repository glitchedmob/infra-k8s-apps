apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sparky-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: sparky-openbao
  target:
    name: sparky-runtime
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SPARKY_FITNESS_API_ENCRYPTION_KEY: "{{ .apiEncryptionKey }}"
        BETTER_AUTH_SECRET: "{{ .betterAuthSecret }}"
        SPARKY_FITNESS_EMAIL_USER: "{{ .smtpUser }}"
        SPARKY_FITNESS_EMAIL_PASS: "{{ .smtpPassword }}"
        SPARKY_FITNESS_EMAIL_FROM: "{{ .smtpFrom }}"
        SPARKY_FITNESS_OIDC_CLIENT_ID: "{{ .clientId }}"
        SPARKY_FITNESS_OIDC_CLIENT_SECRET: "{{ .clientSecret }}"
        SPARKY_FITNESS_OIDC_ISSUER_URL: "{{ .issuerUrl }}"
  data:
    - secretKey: apiEncryptionKey
      remoteRef:
        key: sparky/runtime
        property: apiEncryptionKey
    - secretKey: betterAuthSecret
      remoteRef:
        key: sparky/runtime
        property: betterAuthSecret
    - secretKey: smtpUser
      remoteRef:
        key: sparky/smtp
        property: smtpUser
    - secretKey: smtpPassword
      remoteRef:
        key: sparky/smtp
        property: smtpPassword
    - secretKey: smtpFrom
      remoteRef:
        key: sparky/smtp
        property: smtpFrom
    - secretKey: clientId
      remoteRef:
        key: sparky/oidc
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: sparky/oidc
        property: clientSecret
    - secretKey: issuerUrl
      remoteRef:
        key: sparky/oidc
        property: issuerUrl
