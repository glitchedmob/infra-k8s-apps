apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: mealie-openbao
  target:
    name: mealie-runtime
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SESSION_SECRET: "{{ .sessionSecret }}"
        OIDC_CLIENT_ID: "{{ .clientId }}"
        OIDC_CLIENT_SECRET: "{{ .clientSecret }}"
        OIDC_CONFIGURATION_URL: "{{ .discoveryUrl }}"
  data:
    - secretKey: sessionSecret
      remoteRef:
        key: mealie/runtime
        property: sessionSecret
    - secretKey: clientId
      remoteRef:
        key: mealie/oidc
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: mealie/oidc
        property: clientSecret
    - secretKey: discoveryUrl
      remoteRef:
        key: mealie/oidc
        property: discoveryUrl
