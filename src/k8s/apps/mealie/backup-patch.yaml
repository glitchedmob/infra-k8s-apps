- op: replace
  path: /metadata/name
  value: mealie-backup
- op: replace
  path: /metadata/labels/backup.k8up.io~1app
  value: mealie
- op: replace
  path: /spec/fileExtension
  value: .dump
- op: replace
  path: /spec/backupCommand
  value: >-
    sh -ec 'pg_dump
    --host=mealie-db-rw
    --username=mealie
    --dbname=mealie
    --format=custom
    --no-owner
    --no-privileges'
- op: replace
  path: /spec/pod/spec/serviceAccountName
  value: mealie-backup
- op: replace
  path: /spec/pod/spec/containers/0/image
  value: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
- op: add
  path: /spec/pod/spec/containers/0/env
  value:
    - name: PGPASSWORD
      valueFrom:
        secretKeyRef:
          name: mealie-db-app
          key: password
    - name: PGSSLMODE
      value: require
