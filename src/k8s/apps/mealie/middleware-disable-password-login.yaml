apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mealie-disable-password-login
spec:
  # ALLOW_PASSWORD_LOGIN only hides the form in v3.28.0. Do not expose password token issuance.
  redirectRegex:
    regex: '^.*$'
    replacement: https://mealie.levizitting.com/login
    permanent: false
