apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-bouncer-key
  namespace: crowdsec
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: crowdsec-cache-k8s
    kind: ClusterSecretStore
  target:
    name: crowdsec-bouncer-key
    creationPolicy: Owner
  data:
    - secretKey: BOUNCER_KEY_traefik
      remoteRef:
        key: crowdsec-ssm-cache
        property: BOUNCER_KEY_traefik
