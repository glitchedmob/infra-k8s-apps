apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-backup-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-k8s
    kind: ClusterSecretStore
  target:
    name: k8up-b2-credentials
    creationPolicy: Owner
  data:
    - secretKey: account-id
      remoteRef:
        key: openbao-secrets
        property: b2AccountId
    - secretKey: account-key
      remoteRef:
        key: openbao-secrets
        property: b2AccountKey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-k8up-repo-password
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-k8s
    kind: ClusterSecretStore
  target:
    name: openbao-k8up-repo-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: openbao-secrets
        property: openbaoResticPassword
