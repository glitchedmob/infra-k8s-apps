apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: zitadel-k8s
    kind: ClusterSecretStore
  target:
    name: zitadel-bootstrap
    creationPolicy: Owner
  data:
    - secretKey: masterkey
      remoteRef:
        key: zitadel-secrets
        property: zitadelMasterKey
    - secretKey: initialAdminPassword
      remoteRef:
        key: zitadel-secrets
        property: zitadelInitialAdminPassword
