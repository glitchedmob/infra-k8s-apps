apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-backup-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: backup-cache-k8s
    kind: ClusterSecretStore
  target:
    name: k8up-b2-credentials
    creationPolicy: Owner
  data:
    - secretKey: account-id
      remoteRef:
        key: backup-ssm-cache
        property: account-id
    - secretKey: account-key
      remoteRef:
        key: backup-ssm-cache
        property: account-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-k8up-repo-password
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: zitadel-cache-k8s
    kind: ClusterSecretStore
  target:
    name: zitadel-k8up-repo-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: zitadel-ssm-cache
        property: resticPassword
