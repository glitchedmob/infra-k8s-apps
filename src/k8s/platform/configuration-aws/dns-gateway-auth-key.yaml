apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dns-gateway-auth-key
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kube-system-k8s
    kind: ClusterSecretStore
  target:
    name: dns-gateway-auth-key
    creationPolicy: Owner
  data:
    - secretKey: authkey
      remoteRef:
        key: kube-system-secrets
        property: dnsGatewayAuthKey
