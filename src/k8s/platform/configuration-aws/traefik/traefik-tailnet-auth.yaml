apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: traefik-tailnet-auth
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: traefik-tailnet-auth
    creationPolicy: Owner
  data:
    - secretKey: authkey
      remoteRef:
        key: /homelab/headscale/pods/lz/ingress-gateway-auth-key
