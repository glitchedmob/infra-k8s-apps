apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: erpnext-k8s
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  conditions:
    - namespaces:
        - erpnext
  provider:
    kubernetes:
      remoteNamespace: external-secrets
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: external-secrets
      auth:
        serviceAccount:
          name: eso-erpnext-reader
          namespace: external-secrets
---
