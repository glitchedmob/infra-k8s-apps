apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: backup-cache-k8s
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  conditions:
    - namespaces:
        - erpnext
        - isp-monitoring
        - mcphub
        - mealie
        - openbao
        - sparky
        - zitadel
  provider:
    kubernetes:
      remoteNamespace: external-secrets
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: external-secrets
      auth:
        serviceAccount:
          name: eso-backup-cache-reader
          namespace: external-secrets
---
