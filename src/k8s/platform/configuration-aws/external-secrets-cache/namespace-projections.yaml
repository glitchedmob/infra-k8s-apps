apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erpnext-secrets
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: cache-k8s
  target:
    name: erpnext-secrets
  data:
    - secretKey: b2AccountId
      remoteRef:
        key: ssm-cache
        property: b2AccountId
    - secretKey: b2AccountKey
      remoteRef:
        key: ssm-cache
        property: b2AccountKey
---
