apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ssm-cache
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    external-secrets.io/force-sync: "1"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: ssm-cache
  data:
    - secretKey: argoWorkflowsClientSecret
      remoteRef:
        key: /vm-workloads/lz/infra-vm-workloads/dex-argo-workflows-client-secret
    - secretKey: argocdClientSecret
      remoteRef:
        key: /vm-workloads/lz/infra-vm-workloads/dex-argocd-client-secret
    - secretKey: githubClientSecret
      remoteRef:
        key: /vm-workloads/lz/infra-vm-workloads/dex-github-oauth-client-secret
    - secretKey: grafanaClientSecret
      remoteRef:
        key: /vm-workloads/lz/infra-vm-workloads/dex-grafana-client-secret
    - secretKey: oauth2ProxyClientSecret
      remoteRef:
        key: /vm-workloads/lz/infra-vm-workloads/dex-oauth2-proxy-client-secret
    - secretKey: openbaoClientSecret
      remoteRef:
        key: /vm-workloads/lz/infra-vm-workloads/dex-openbao-client-secret
    - secretKey: cookieSecret
      remoteRef:
        key: /vm-workloads/lz/infra-vm-workloads/oauth2-proxy-cookie-secret
    - secretKey: b2AccountId
      remoteRef:
        key: /vm-workloads/lz/infra-vm-workloads/backups/b2-account-id
    - secretKey: b2AccountKey
      remoteRef:
        key: /vm-workloads/lz/infra-vm-workloads/backups/b2-account-key
    - secretKey: dnsGatewayAuthKey
      remoteRef:
        key: /homelab/headscale/pods/lz/dns-gateway-auth-key
    - secretKey: ingressGatewayAuthKey
      remoteRef:
        key: /homelab/headscale/pods/lz/ingress-gateway-auth-key
    - secretKey: openbaoResticPassword
      remoteRef:
        key: /vm-workloads/lz/infra-vm-workloads/backups/openbao/restic-password
    - secretKey: zitadelMasterKey
      remoteRef:
        key: /vm-workloads/lz/infra-vm-workloads/zitadel/master-key
    - secretKey: zitadelInitialAdminPassword
      remoteRef:
        key: /vm-workloads/lz/infra-vm-workloads/zitadel/initial-admin-password
    - secretKey: zitadelResticPassword
      remoteRef:
        key: /vm-workloads/lz/infra-vm-workloads/backups/zitadel/restic-password
