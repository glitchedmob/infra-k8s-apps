apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-ingress-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
    infra.levizitting.com/health-gate: "true"
spec:
  project: platform
  source:
    repoURL: ssh://git@github.com/glitchedmob/infra-k8s-apps.git
    path: src/k8s/platform/configuration-ingress
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
