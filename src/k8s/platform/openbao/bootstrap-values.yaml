server:
  serviceAccount:
    name: openbao
    annotations:
      infra.levizitting.com/aws-role-arn: "arn:aws:iam::${AWS_ACCOUNT_ID}:role/lz-k3s/lz-k3s-openbao"
  volumes:
    - name: levizitting-ca-bundle
      configMap:
        name: levizitting-ca-bundle
    - name: openbao-seal
      emptyDir:
        medium: Memory
    - name: openbao-recovery-work
      emptyDir:
        medium: Memory
    - name: openbao-recovery-config
      configMap:
        name: openbao-recovery
    - name: openbao-recovery-b2-credentials
      secret:
        secretName: k8up-b2-credentials
    - name: openbao-recovery-repository-password
      secret:
        secretName: openbao-k8up-repo-password
    - name: aws-web-identity-token
      projected:
        sources:
          - serviceAccountToken:
              audience: sts.amazonaws.com
              expirationSeconds: 3600
              path: token
  volumeMounts:
    - name: levizitting-ca-bundle
      mountPath: /etc/ssl/certs/levizitting-ca.crt
      subPath: ca.crt
      readOnly: true
    - name: openbao-seal
      mountPath: /openbao/seals
      readOnly: true
  extraInitContainers:
    - name: fetch-unseal-key
      image: amazon/aws-cli:2.35.16
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -euo pipefail
          service_account_path=/var/run/secrets/kubernetes.io/serviceaccount
          kubernetes_token=$(cat "${service_account_path}/token")
          namespace=$(cat "${service_account_path}/namespace")
          export AWS_ROLE_ARN="$(
            curl --fail --silent --show-error \
              --cacert "${service_account_path}/ca.crt" \
              --header "Authorization: Bearer ${kubernetes_token}" \
              "https://kubernetes.default.svc/api/v1/namespaces/${namespace}/serviceaccounts/openbao" |
              jq -er '.metadata.annotations["eks.amazonaws.com/role-arn"]'
          )"
          echo "fetch-unseal-key: requesting unseal key from SSM..."
          aws ssm get-parameter \
            --with-decryption \
            --name /vm-workloads/lz/infra-vm-workloads/openbao-unseal-key \
            --query Parameter.Value \
            --output text \
            | tr -d '\n' > /openbao/seals/current.key
          key_byte_count=$(wc -c < /openbao/seals/current.key)
          echo "fetch-unseal-key: wrote ${key_byte_count} bytes to /openbao/seals/current.key"
          if [ "${key_byte_count}" -ne 44 ]; then
            echo "fetch-unseal-key: ERROR expected 44-byte base64 key, got ${key_byte_count}" >&2
            exit 1
          fi
          echo "fetch-unseal-key: done"
      env:
        - name: AWS_REGION
          value: us-east-2
        - name: AWS_WEB_IDENTITY_TOKEN_FILE
          value: /var/run/secrets/eks.amazonaws.com/serviceaccount/token
      volumeMounts:
        - name: openbao-seal
          mountPath: /openbao/seals
        - name: aws-web-identity-token
          mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
          readOnly: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi
    - name: prepare-recovery
      image: ghcr.io/k8up-io/k8up:v2.15.0
      command: ["/bin/bash", "/recovery-config/prepare.sh"]
      env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: RESTIC_REPOSITORY
          value: b2:levizitting-on-prem-k3s-backups:openbao
        - name: RESTIC_CACHE_DIR
          value: /tmp/restic-cache
      volumeMounts:
        - name: data
          mountPath: /openbao/data
        - name: openbao-recovery-work
          mountPath: /recovery
        - name: openbao-recovery-config
          mountPath: /recovery-config
          readOnly: true
        - name: openbao-recovery-b2-credentials
          mountPath: /recovery-credentials/b2
          readOnly: true
        - name: openbao-recovery-repository-password
          mountPath: /recovery-credentials/repository
          readOnly: true
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
    - name: recover-raft-or-join
      image: quay.io/openbao/openbao:2.5.5
      command: ["/bin/sh", "/recovery-config/recover.sh"]
      env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: VAULT_CLIENT_TIMEOUT
          value: 10m
      volumeMounts:
        - name: data
          mountPath: /openbao/data
        - name: openbao-seal
          mountPath: /openbao/seals
          readOnly: true
        - name: openbao-recovery-work
          mountPath: /recovery
        - name: openbao-recovery-config
          mountPath: /recovery-config
          readOnly: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
