apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: visitor-ip-probe-tls
spec:
  secretName: visitor-ip-probe-tls
  # The probe uses curl --resolve and the existing CA, not public DNS or HTTP-01.
  issuerRef:
    name: levizitting-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - visitor-ip-probe.levizitting.com
  usages:
    - digital signature
    - key encipherment
