apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      replicas: 3
      podAnnotations:
        secret.reloader.stakater.com/reload: cloudflared-token,traefik-tailnet-auth
      additionalVolumes:
        - name: cloudflared-no-api-token
          emptyDir:
            medium: Memory
        # Only the public CA certificate is mounted, not the TLS private key.
        - name: cloudflared-origin-ca
          secret:
            secretName: traefik-dashboard-tls
            items:
              - key: ca.crt
                path: ca.crt
        # The node's Traefik replica keeps its tailnet identity across pod rollouts.
        # This is separate from the node's own Tailscale state.
        - name: traefik-tailnet-state
          hostPath:
            path: /var/lib/lz-traefik-tailnet
            type: DirectoryOrCreate
        - name: traefik-tailnet-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
      additionalContainers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.2
          imagePullPolicy: IfNotPresent
          command:
            - cloudflared
            - tunnel
            - --no-autoupdate
            - --protocol
            - http2
            - --loglevel
            - info
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          # Traefik needs its service account token; the connector does not.
          volumeMounts:
            - name: cloudflared-no-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: cloudflared-origin-ca
              mountPath: /etc/cloudflared/origin-ca
              readOnly: true
          ports:
            - name: tunnel-metrics
              containerPort: 2000
          startupProbe:
            httpGet:
              path: /ready
              port: tunnel-metrics
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: tunnel-metrics
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: tunnel-metrics
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: tailscale
          image: tailscale/tailscale:v1.88.4
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: traefik-tailnet-auth
                  key: authkey
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: TS_HOSTNAME
              value: traefik-$(NODE_NAME)
            - name: TS_EXTRA_ARGS
              value: --login-server=https://headscale.levizitting.com --accept-routes=false
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_USERSPACE
              value: "false"
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_KUBE_SECRET
              value: ""
            # Filesystem state needs no Kubernetes client or service-account token.
            - name: KUBERNETES_SERVICE_HOST
              value: ""
            - name: TS_AUTH_ONCE
              value: "true"
          securityContext:
            # Override the chart's pod-level non-root policy for this sidecar only.
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
          # The sidecar shares Traefik's network namespace, but needs no API token.
          volumeMounts:
            - name: cloudflared-no-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: traefik-tailnet-state
              mountPath: /var/lib/tailscale
            - name: traefik-tailnet-tun
              mountPath: /dev/net/tun
          ports:
            - name: tailnet-udp
              containerPort: 41641
              protocol: UDP
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - 'tailscale status --json | grep -Eq ''"BackendState"[[:space:]]*:[[:space:]]*"Running"'''
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - 'tailscale status --json | grep -Eq ''"BackendState"[[:space:]]*:[[:space:]]*"Running"'''
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/instance: traefik-kube-system
                app.kubernetes.io/name: traefik
            topologyKey: kubernetes.io/hostname
    ports:
      # Explicit defaults keep implicit application routers off the probe listener.
      web:
        asDefault: true
      cloudflared:
        port: 9443
        hostIP: 127.0.0.1
        asDefault: false
        expose:
          default: false
        protocol: TCP
        forwardedHeaders:
          trustedIPs:
            - 127.0.0.1/32
          # Preserve Cloudflare's chain without appending the connector's loopback IP.
          notAppendXForwardedFor: true
        http:
          tls:
            enabled: true
        transport:
          respondingTimeouts:
            idleTimeout: 0
      websecure:
        asDefault: true
        # Only the public edge may supply a PROXY-protocol visitor address.
        proxyProtocol:
          trustedIPs:
            - 100.64.0.10/32
        # Tunnel origin: https://127.0.0.1:8443, with Origin Server Name
        # traefik.levizitting.com and CA Pool /etc/cloudflared/origin-ca/ca.crt.
        # Only the co-located connector can supply the visitor's scheme.
        forwardedHeaders:
          trustedIPs:
            - 127.0.0.1/32
        transport:
          respondingTimeouts:
            idleTimeout: 0
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    tracing:
      otlp:
        enabled: true
        grpc:
          enabled: true
          endpoint: otelcol-collector.observability.svc.cluster.local:4317
          insecure: true
    logs:
      general:
        format: json
      access:
        enabled: true
        format: json
