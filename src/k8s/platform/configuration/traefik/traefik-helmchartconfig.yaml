apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      replicas: 3
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
    ports:
      # Only explicit private routers use this port. Public edge and tunnel
      # origins continue to use 80/443, where these routers do not exist.
      ispprivate:
        port: 8444
        exposedPort: 8443
        expose:
          default: true
        protocol: TCP
        asDefault: false
        tls:
          enabled: true
      web:
        asDefault: true
      websecure:
        asDefault: true
        transport:
          respondingTimeouts:
            idleTimeout: 0
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    tracing:
      otlp:
        enabled: true
        grpc:
          enabled: true
          endpoint: otelcol-collector.observability.svc.cluster.local:4317
          insecure: true
    logs:
      general:
        format: json
      access:
        enabled: true
        format: json
