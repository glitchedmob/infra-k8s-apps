apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crowdsec
  namespace: argocd
  annotations:
    # Loki starts in wave 4; the log analyzer needs it before becoming healthy.
    argocd.argoproj.io/sync-wave: "5"
    infra.levizitting.com/health-gate: "true"
spec:
  project: platform
  sources:
    - chart: crowdsec
      repoURL: https://crowdsecurity.github.io/helm-charts
      targetRevision: 0.24.2
      helm:
        values: |
          container_runtime: containerd
          config:
            simulation.yaml: |
              simulation: false
          lapi:
            envFrom:
              - secretRef:
                  name: crowdsec-bouncer-key
          agent:
            # One analyzer shares detection buckets across all Traefik replicas.
            isDeployment: true
            replicas: 1
            strategy:
              type: Recreate
            hostVarLog: false
            additionalAcquisition:
              - source: loki
                url: http://loki.observability.svc.cluster.local:3100
                query: '{namespace="kube-system", container="traefik"}'
                limit: 1000
                wait_for_ready: 1m
                max_failure_duration: 5m
                labels:
                  # Alloy removes the CRI envelope before sending logs to Loki.
                  type: traefik
            env:
              - name: COLLECTIONS
                value: crowdsecurity/traefik
          appsec:
            enabled: true
            replicas: 2
            acquisitions:
              - source: appsec
                listen_addr: "0.0.0.0:7422"
                path: /
                appsec_config: crowdsecurity/appsec-default
                labels:
                  type: appsec
            env:
              - name: COLLECTIONS
                value: "crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules"
    - repoURL: ssh://git@github.com/glitchedmob/infra-k8s-apps.git
      path: src/k8s/platform/services/crowdsec
      targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: crowdsec
  # Helm generates these credentials on first sync; preserve them on later renders.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: crowdsec-lapi-secrets
      namespace: crowdsec
      jsonPointers:
        - /data/csLapiSecret
        - /data/registrationToken
    - group: apps
      kind: Deployment
      name: crowdsec-lapi
      namespace: crowdsec
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1lapi-secret
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
