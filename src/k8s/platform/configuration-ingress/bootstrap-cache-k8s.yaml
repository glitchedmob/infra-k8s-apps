apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: bootstrap-cache-k8s
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  provider:
    kubernetes:
      remoteNamespace: kube-system
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-bootstrap-cache-reader
